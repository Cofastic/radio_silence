options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    allow-transfer { none; };
    minimal-responses yes;
    dnssec-validation no;
    rate-limit { responses-per-second 300; };
};

dnssec-policy "nsec-only" {
    keys { csk lifetime unlimited algorithm ecdsap256sha256; };
    // no nsec3param => plain NSEC (required for this challenge)
};

zone "signals.cofastic.com" {
    type primary;
    file "/zones/db.signals";
    dnssec-policy "nsec-only";
    inline-signing yes;
};

zone "comms-check.cofastic.com" {
    type primary;
    file "/zones/db.check";
};
